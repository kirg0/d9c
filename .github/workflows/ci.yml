name: CI

# Quality gate on every push and pull request: gofmt + go vet +
# golangci-lint + go test — the same `make check` run locally.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: make check
        run: make check

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test -race
        run: make race

  # The marketplace, the plugin manifest, its MCP config and the skills,
  # checked by Claude Code's own validator (no credentials needed). The
  # skill/eval content checks run in `make check` (skills_test.go, evals_test.go).
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: claude plugin validate
        run: |
          claude plugin validate . --strict
          claude plugin validate plugins/d9c --strict
